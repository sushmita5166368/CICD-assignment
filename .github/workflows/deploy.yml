name: CI-CD Pipeline

on:
  push:
    branches:
          - main
  workflow_dispatch:

jobs:
  test:
   runs-on: ubuntu-latest
   steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r flask-app/requirements.txt

      - name: PYtest
        working-directory: flask-app
        env:
          PYTHONPATH: .
        run: |
          pytest tests/
      - name: Build Docker image
        run: |
           docker build -t public-repo:${{github.sha}} ./flask-app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
         aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
         aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
         aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: PUSH to ECR Repo
        run: |
          docker tag public-repo:${{github.sha}} ${{steps.login-ecr.outputs.registry}}/public-repo:${{github.sha}}
          docker push ${{steps.login-ecr.outputs.registry}}/public-repo:${{github.sha}}

      
        
         
