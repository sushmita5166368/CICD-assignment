name: CI-CD Pipeline

on:
  push:
    branches:
          - main
  workflow_dispatch:

jobs:
  test:
   runs-on: ubuntu-latest
   steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
            python -m pip install --upgrade pip
            pip install -r flask-app/requirements.txt

      - name: Run tests
        working-directory: flask-app
        env:
          PYTHONPATH: .
        run: |
          pytest tests/
